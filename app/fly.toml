# fly.toml app configuration file generated for nail-salon-wbmpoq on 2026-10-08T12:16:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nail-salon-wbmpoq'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOW_SIGNUP = '1'
  DATABASE_URL = '/data/salon.db'
  PHOTO_DIR = '/data/photos'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/login'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
