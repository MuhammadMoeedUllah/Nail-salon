# Fly.io config for Salon Pay Records: one machine, one volume, SQLite on the volume.
#
# Web launcher (fly.io dashboard, "Launch from GitHub"):
#   Working directory: app        Config path: leave empty
#   Internal port: 8080           Memory: 512MB          Region: ewr (or iad)
#   Do not add Managed Postgres.  Add the APP_SECRET secret after the first deploy.
#
# Command line, from this app/ folder:
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly secrets set APP_SECRET=$(openssl rand -base64 32)
#   fly deploy
#
# The app name below is only a default; the launcher and --name replace it.
app = "salon-pay-records"
primary_region = "ewr"

# Naming the Dockerfile makes `fly launch` use it as is. Without this, Fly scans the
# source, detects SvelteKit and runs its Node Dockerfile generator, which tries to
# install packages with pnpm and rewrites the start command for SQLite apps.
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_URL = "/data/salon.db"
  PHOTO_DIR = "/data/photos"
  # ORIGIN is not set on purpose: behind Fly's HTTPS proxy the server uses https://<Host header>,
  # which matches whatever app name or custom domain you choose.
  ALLOW_SIGNUP = "1"

# One volume holds the database and photos. Fly creates it on the first deploy and,
# because the app mounts a volume, runs exactly one machine. Never scale above one:
# a second machine would get its own separate database.
[[mounts]]
  source = "data"
  destination = "/data"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
